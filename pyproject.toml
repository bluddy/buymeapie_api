[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buymeapie-api"
version = "0.1.0"
description = "Buy Me a Pie! (buymeapie.com) API Client & CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "python-dotenv>=0.19.0",
]

[project.scripts]
buymeapie = "buymeapie:main"

[tool.setuptools]
py-modules = ["buymeapie"]
